name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK (installable, debug-signed)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned, R8-optimized)
        run: ./gradlew assembleRelease --no-daemon

      - name: Get Version Name
        id: version
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # NOTE: with splits.abi enabled the outputs are app-<abi>-*.apk and
      # app-universal-*.apk — there is NO plain app-release-unsigned.apk.
      # The universal APK is what end users should download.

      - name: Upload Debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: AeroVPN-debug.apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: AeroVPN-release-unsigned.apk
          path: app/build/outputs/apk/release/app-universal-release-unsigned.apk

      # softprops/action-gh-release already attaches the APKs — no separate
      # upload-release-asset step needed (the old one referenced a missing
      # step id and the wrong APK path, so it could never have worked).
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/release/app-universal-release-unsigned.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
